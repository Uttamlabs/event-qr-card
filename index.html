<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Event Experience</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="main-video" playsinline preload="auto" muted></video>

  <div id="start-screen">
    <button type="button" class="enter-btn">Tap to Enter</button>
  </div>

  <div id="cta-popup">
    <div class="cta-content">
      <h2>Ready for your next event?</h2>
      <div class="cta-actions">
        <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer" class="cta-btn">Follow on Instagram</a>
        <a href="#book" class="cta-btn cta-btn--primary">Book Your Event</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
